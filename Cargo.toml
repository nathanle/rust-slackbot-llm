[package]
name = "rust-slackbot-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13.3", features = ["multipart", "json"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
serde = { version = "1" }
serde_json = "1"
uuid = { version = "1.3", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
bincode = "1.3"
dotenvy = "0.15"
plotters = "0.3"
plotters-bitmap = "0.3"
image = { version = "0.25", features = ["png"] }
hf-hub = "1.0.0"
tokenizers = "0.19"
time = "0.3.36"
thread-priority = "1"
regex = "1.5"
chrono = "0.4.33"
log = "0.4"
pretty_env_logger = "0.5"
num-traits = "0.2.19"
candle-transformers = "0.11.0"
candle-core = { version = "0.11.0", features = ["cuda"] }
candle-nn = { version = "0.11.0",  features = ["cuda"] }
font-kit = "0.14.3"

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
axum-test = "15"
http = "1"

[features]
